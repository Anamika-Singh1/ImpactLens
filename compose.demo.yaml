# Isolated, loopback-only, synthetic demo. Never merge with the production Compose file.
name: impactlens-demo
services:
  postgres-demo:
    image: postgres:17-alpine
    environment:
      {
        POSTGRES_USER: demo,
        POSTGRES_PASSWORD: synthetic_local_only,
        POSTGRES_DB: impactlens_demo,
      }
    volumes: [demo_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U demo -d impactlens_demo']
      interval: 5s
      timeout: 3s
      retries: 20
  redis-demo:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [demo_redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: impactlens-migrate:local
    build: { context: ., target: migrate }
    environment: &demoenv
      NODE_ENV: development
      HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://demo:synthetic_local_only@postgres-demo:5432/impactlens_demo?schema=public&connect_timeout=3&pool_timeout=3&socket_timeout=3
      REDIS_URL: redis://redis-demo:6379
      GITHUB_ENABLED: 'false'
      AI_PROVIDER: disabled
    profiles: [setup]
    depends_on:
      {
        postgres-demo: { condition: service_healthy },
        redis-demo: { condition: service_healthy },
      }
  seed:
    image: impactlens-migrate:local
    environment:
      <<: *demoenv
      DEMO_SEED_ALLOWED: synthetic-only
      DEMO_API_URL: http://api:3000
    command: [node, scripts/demo.mjs]
    profiles: [setup]
    depends_on: { api: { condition: service_healthy } }
  api:
    image: impactlens-api:local
    build: { context: ., target: api }
    environment: *demoenv
    depends_on:
      {
        postgres-demo: { condition: service_healthy },
        redis-demo: { condition: service_healthy },
      }
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: impactlens-worker:local
    build: { context: ., target: worker }
    environment: *demoenv
    depends_on:
      {
        postgres-demo: { condition: service_healthy },
        redis-demo: { condition: service_healthy },
      }
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    image: impactlens-web:local
    build: { context: ., target: web }
    ports: ['127.0.0.1:8080:8080']
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  demo_postgres:
  demo_redis:
