worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Deliberately omit URLs, query strings, headers and bodies from access logs.
  log_format safe '$status $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /health/live { access_log off; return 200 'ok'; }
    location /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Discard client-supplied forwarding headers. HTTPS is an external edge responsibility.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_read_timeout 65s;
      proxy_connect_timeout 5s;
      client_max_body_size 13m;
      proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control 'public, immutable'; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
  }
}
